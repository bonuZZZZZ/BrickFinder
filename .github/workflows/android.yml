
name: Build BrickFinder APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

     
      
      - name: Diagnose Gradle configuration
        run: |
          echo "=== Build files ==="
          ls -la app/
          echo "=== Module properties ==="
          gradle :app:properties --no-daemon | grep -E 'buildFile:|projectDir:'
          echo "=== Gradle configuration ==="
          gradle :app:tasks --all --info --no-daemon



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrickFinder-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
